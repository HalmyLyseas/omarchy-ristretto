name: test

"on":
  push:
    branches: [master, hardening, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    env:
      RISTRETTO_SHELL_TREE: /tmp/omarchy/shell
      RISTRETTO_PLUGIN_VALIDATOR: /tmp/omarchy/bin/omarchy-plugin-validate
    steps:
      # archlinux:latest ships pacman but not git, so install it before
      # checkout can run. Full sync+upgrade, never a bare `-Sy` -- a
      # partial upgrade is Arch's own well-documented way to break a system.
      - name: Install git
        run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v7

      - name: Trust the checkout (container runs as root, workspace is owned by the runner uid)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install test dependencies
        run: |
          # Measured set: quickshell (qs, and pulls in qt6-declarative's
          # qmllint as a side effect) + cage (headless Wayland compositor)
          # run the probe suites; nodejs runs the JS suites; python runs the
          # idle writer tests; procps-ng provides `ps`; jq is what the
          # plugin-validate script needs. Every external tool the plugin
          # spawns is mocked in test/mocks.
          pacman -Syu --noconfirm quickshell cage nodejs python procps-ng jq

      - name: Clone exact Omarchy source
        run: |
          # Pin the compatibility target instead of testing whatever the
          # stable package happens to be today.
          git clone --depth 1 --branch v4.0.5 https://github.com/basecamp/omarchy.git /tmp/omarchy
          test "$(git -C /tmp/omarchy describe --tags --exact-match)" = v4.0.5
          test -d "$RISTRETTO_SHELL_TREE"
          test -x "$RISTRETTO_PLUGIN_VALIDATOR"

      - name: qmllint every .qml file (0 errors, warnings allowed)
        run: bash test/lint-qml

      - name: omarchy plugin validate (manifest schema, entry points, no symlinks)
        run: '"$RISTRETTO_PLUGIN_VALIDATOR" .'

      - name: Node unit tests (Model.js, QML Text-sink audit, comment hygiene)
        run: node --test test/*.test.js

      - name: Idle writer tests
        run: python3 test/idle-writer.test.py

      - name: Host contract (read-only pin against the selected shell tree)
        run: node test/host-contract.mjs

      - name: Headless service/UI probes (cage)
        env:
          WLR_BACKENDS: headless
          WLR_RENDERER: pixman
          WLR_LIBINPUT_NO_DEVICES: "1"
          XDG_RUNTIME_DIR: /tmp/xdg-runtime
          QT_QUICK_BACKEND: software
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          cage -- bash test/probe/run
          cage -- bash test/probe/run-ui
          for probe in test/probe/run-*; do
            [[ "$probe" == */run-ui ]] && continue
            cage -- bash "$probe"
          done
